# Free Render web services sleep after 15 minutes with no traffic.
# While asleep, in-process cron cannot run and GHL webhooks often time out on cold start.
# This ping keeps the API awake and triggers the unread → Expo push poll via GET /health.
name: Keep Render awake

on:
  schedule:
    # Every 5 minutes (safer than 10 against the 15-minute free idle timeout).
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Oraia API health
        run: |
          set -e
          for i in 1 2 3; do
            if curl -fsS --max-time 120 "https://oraia-mobile-app.onrender.com/health"; then
              echo ""
              echo "Health OK (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed; retrying..."
            sleep 15
          done
          echo "Health ping failed"
          exit 1
